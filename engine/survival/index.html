<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LAST SIGNAL · 생존 FPS</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#142425;color:#f3f2df;font:600 15px system-ui,sans-serif;overflow:hidden;touch-action:none}canvas{width:100vw;height:100dvh;display:block;image-rendering:pixelated}#hud,#ammo,#zone,#notice,#panel,#touch{position:fixed}#hud,#ammo,#zone{background:#132222dc;border-left:3px solid #f6c355;padding:8px 13px;font-variant-numeric:tabular-nums}#hud{top:14px;left:14px}#zone{top:14px;right:14px}#ammo{bottom:16px;right:16px}#notice{left:50%;bottom:19%;transform:translateX(-50%);text-shadow:0 2px 3px black;text-align:center}#panel{inset:0;background:linear-gradient(90deg,#0e211ff5,#0e211fbb 46%,transparent);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:8vw}#panel[hidden]{display:none}small{font:700 12px monospace;letter-spacing:.22em;color:#ffcc68}h1{font:1000 clamp(48px,10vw,132px)/.9 system-ui;margin:18px 0;letter-spacing:-.07em}p{line-height:1.7;margin:8px 0 20px}button{color:#17241d;background:#ffd06c;font:800 16px system-ui;border:0;padding:14px 26px;cursor:pointer}#touch{display:none;inset:auto 0 12px;justify-content:space-between;align-items:end;pointer-events:none;padding:10px}#touch div{display:grid;grid-template-columns:repeat(3,40px);gap:3px}#touch button{pointer-events:auto;padding:8px 2px;background:#132222bb;color:white}body.play #touch{display:none}@media(pointer:coarse){body.play #touch{display:flex}#ammo{bottom:110px}#hud,#zone{font-size:12px}}
</style><canvas id="view"></canvas><div id="hud"></div><div id="zone"></div><div id="ammo"></div><div id="notice"></div><section id="panel"><small>COASTAL RELAY / SOLO SURVIVAL</small><h1>LAST SIGNAL</h1><p id="brief">해안 중계소에 생존자 8명이 진입했습니다.<br>노란 보급함을 확보하고 축소되는 구역에서 마지막까지 살아남으세요.</p><button id="start">전장 진입 →</button><p>WASD 이동 · 마우스 또는 ← → 조준 · 클릭 / Space 사격 · R 재장전<br>터치 화면은 방향 버튼으로 이동하고 화면을 밀어 조준합니다.</p></section><div id="touch"><div><i></i><button data-k="KeyW">▲</button><i></i><button data-k="KeyA">◀</button><button data-k="KeyS">▼</button><button data-k="KeyD">▶</button></div><div><button data-k="KeyR">장전</button><button data-k="Space" style="grid-column:span 2">사격</button></div></div>
<script>
'use strict';
const by=id=>document.getElementById(id), canvas=by('view'),g=canvas.getContext('2d'), keys=new Set(), TAU=Math.PI*2;
const grid=Array.from({length:32},()=>Array(32).fill(0));
function block(x,y,w,h,type){for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)grid[j][i]=type}
block(0,0,32,1,1);block(0,31,32,1,1);block(0,0,1,32,1);block(31,0,1,32,1);
for(const b of [[5,5,4,3,2],[13,4,5,2,3],[23,5,3,4,2],[5,13,2,6,3],[12,12,3,3,2],[19,14,4,2,3],[25,19,2,5,2],[11,22,4,2,3],[4,25,3,2,2],[19,25,3,3,2]])block(...b);
const wall=(x,y)=>grid[Math.floor(y)]?.[Math.floor(x)]??1, dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function ray(x,y,dx,dy,limit=50){let i=Math.floor(x),j=Math.floor(y),sx=Math.sign(dx),sy=Math.sign(dy),ax=1/Math.abs(dx),ay=1/Math.abs(dy),tx=dx?(dx>0?i+1-x:x-i)*ax:Infinity,ty=dy?(dy>0?j+1-y:y-j)*ay:Infinity,d=0,side;
while(d<limit){side=tx<ty;if(side){d=tx;tx+=ax;i+=sx}else{d=ty;ty+=ay;j+=sy}const type=grid[j]?.[i]??1;if(type)return {d,type,side,u:side?y+d*dy:x+d*dx}}return {d:limit,type:0,u:0}}
function move(p,dx,dy){if(!wall(p.x+dx+Math.sign(dx)*.22,p.y))p.x+=dx;if(!wall(p.x,p.y+dy+Math.sign(dy)*.22))p.y+=dy}
let p,bots,boxes,time,radius,angle,clip,reserve,reload,shot,flash,kills,active=false,msg,until,pitch=0;
function reset(){p={x:16.5,y:23,hp:100};bots=[[16.5,17],[9,10],[24,12],[4,20],[22,22],[10,28],[21,4]].map(([x,y],i)=>({x,y,hp:60,cool:2+i*.35,drift:i*1.7}));boxes=[[16.5,21.4],[8,11],[18,18],[23,23],[10,20],[14,9]].map(([x,y])=>({x,y,on:true}));time=0;radius=22;angle=-Math.PI/2;pitch=0;clip=12;reserve=36;reload=shot=flash=kills=until=0;msg=''}
function say(s){msg=s;until=time+2}
function finish(win){active=false;keys.clear();document.exitPointerLock?.();document.body.classList.remove('play');by('panel').hidden=false;by('brief').textContent=(win?'최후의 생존자':'생존 종료')+' · '+(win?1:bots.filter(b=>b.hp>0).length+1)+'위 · '+kills+' 처치 · '+Math.floor(time)+'초';by('start').textContent='다시 진입 →'}
function load(){if(!reload&&clip<12&&reserve){reload=1.1;say('재장전 중…')}}
function fire(){if(shot||reload)return;if(!clip){load();return}clip--;shot=.2;flash=.09;
let best=ray(p.x,p.y,Math.cos(angle),Math.sin(angle)).d,target;
for(const b of bots){if(b.hp<=0)continue;const dx=b.x-p.x,dy=b.y-p.y,d=dx*Math.cos(angle)+dy*Math.sin(angle),off=Math.abs(dy*Math.cos(angle)-dx*Math.sin(angle));if(d>0&&d<best&&off<.33&&Math.abs(pitch)*d<.78){best=d;target=b}}
if(target){target.hp-=32;say(target.hp<=0?'상대 탈락':'명중');if(target.hp<=0)kills++}}
function update(dt){time+=dt;radius=Math.max(1,22-Math.max(0,time-12)*.19);const zoneDist=o=>Math.hypot(o.x-16,o.y-16);angle+=((+keys.has('ArrowRight'))-(+keys.has('ArrowLeft')))*dt*2;
let f=+keys.has('KeyW')-keys.has('KeyS'),s=+keys.has('KeyD')-keys.has('KeyA'),k=dt*3.5/Math.max(1,Math.hypot(f,s));move(p,(Math.cos(angle)*f-Math.sin(angle)*s)*k,(Math.sin(angle)*f+Math.cos(angle)*s)*k);
shot=Math.max(0,shot-dt);flash=Math.max(0,flash-dt);if(reload){reload=Math.max(0,reload-dt);if(!reload){let n=Math.min(12-clip,reserve);clip+=n;reserve-=n}}if(keys.has('KeyR'))load();if(keys.has('Space')||keys.has('Fire'))fire();
for(let b of boxes)if(b.on&&dist(p,b)<1.1){b.on=false;reserve+=18;p.hp=Math.min(100,p.hp+22);say('보급 확보 · 탄약 +18 / 체력 회복')}
if(zoneDist(p)>radius)p.hp-=dt*7;
for(const b of bots){if(b.hp<=0)continue;if(zoneDist(b)>radius)b.hp-=dt*7;if(b.hp<=0)continue;
const rivals=[p,...bots.filter(a=>a!==b&&a.hp>0)].sort((a,c)=>dist(a,b)-dist(c,b));const t=rivals[0],d=Math.max(.001,dist(t,b)),dx=(t.x-b.x)/d,dy=(t.y-b.y)/d,visible=ray(b.x,b.y,dx,dy,d).d>=d;
const dest=zoneDist(b)>radius-1?{x:16,y:16}:t;let heading=Math.atan2(dest.y-b.y,dest.x-b.x);if(visible&&d<6&&dest===t)heading+=Math.PI*.5*Math.sin(time*.7+b.drift);if(wall(b.x+.7*Math.cos(heading),b.y+.7*Math.sin(heading)))heading+=Math.PI*.55*(Math.sin(time*.65+b.drift)>0?1:-1);move(b,Math.cos(heading)*dt,Math.sin(heading)*dt);b.cool-=dt;if(b.cool<=0&&d<10&&visible){t.hp-=t===p?4:13;b.cool=1.4+Math.random()*.9}}
if(p.hp<=0||bots.every(b=>b.hp<=0))finish(p.hp>0)}
const rect=(x,y,w,h,color)=>{g.fillStyle=color;g.fillRect(Math.floor(x),Math.floor(y),Math.ceil(w),Math.ceil(h))};
function draw(){const H=240,W=Math.max(160,Math.round(H*innerWidth/innerHeight));if(canvas.width!==W||canvas.height!==H){canvas.width=W;canvas.height=H}const focal=W/(2*Math.tan(.62)),mid=Math.round(H*.49+pitch*focal),cx=Math.cos(angle),cy=Math.sin(angle),depth=new Float32Array(W);
let sky=g.createLinearGradient(0,0,0,Math.max(1,mid));sky.addColorStop(0,'#45899c');sky.addColorStop(1,'#fae3af');rect(0,0,W,H,sky);
for(let x=0;x<W;x+=2){let a=angle+Math.atan((x-W/2)/focal),ridge=13+8*Math.sin(a*9)+4*Math.sin(a*21);rect(x,mid-ridge,2,ridge+2,'#78908a')}
rect(0,mid,W,H,'#838752');for(let y=Math.max(0,mid+1);y<H;y+=2){const d=.85*focal/(y-mid);for(let x=0;x<W;x+=3){const off=(x-W/2)/focal,wx=p.x+d*(cx-cy*off),wy=p.y+d*(cy+cx*off);const grain=Math.sin(Math.floor(wx*4)*31+Math.floor(wy*4)*59);rect(x,y,3,2,Math.abs(wx-16)<1.8?'#9b9574':grain>.45?'#90905b':grain<-.6?'#777e50':'#858853')}}
for(let x=0;x<W;x++){const q=(x-W/2)/focal,r=ray(p.x,p.y,cx-cy*q,cy+cx*q);depth[x]=r.d;const scale=focal/r.d,base=mid+.85*scale,top=base-scale*(r.type===1?1.1:2.1),u=r.u-Math.floor(r.u),rib=u<.1;const colors=r.type===3?['#9d5943','#bd7351']:r.type===2?['#486b69','#63837a']:['#747762','#96977b'];rect(x,top,1,base-top,colors[+(r.side&&!rib)]);rect(x,top,1,Math.max(1,.09*scale),'#beb49a');if(r.type===2&&u>.19&&u<.78)rect(x,top+.42*scale,1,.47*scale,'#304c50');if(r.type===3&&rib)rect(x,top,1,base-top,'#84523f')}
const sprites=[...boxes.filter(b=>b.on),...bots.filter(b=>b.hp>0)].sort((a,b)=>dist(p,b)-dist(p,a));
for(const o of sprites){const dx=o.x-p.x,dy=o.y-p.y,d=dx*cx+dy*cy;if(d<.2)continue;const sc=focal/d,center=W/2+(dy*cx-dx*cy)*sc,foot=mid+.85*sc;
function part(l,t,w,h,c){let left=Math.max(0,Math.floor(center+l*sc)),right=Math.min(W,Math.ceil(center+(l+w)*sc));for(let x=left;x<right;x++)if(d<depth[x])rect(x,foot-t*sc,1,h*sc,c)}
if(o.on){part(-.33,.48,.66,.48,'#795629');part(-.36,.49,.72,.12,'#ffc459');part(-.17,.43,.08,.42,'#dcb366')}else{part(-.22,.65,.16,.65,'#283e42');part(.06,.65,.16,.65,'#31464a');part(-.27,1.28,.54,.68,'#8b4d36');part(-.16,1.56,.32,.29,'#c58e67');part(-.21,1.65,.42,.17,'#334f50');part(-.31,1.18,.68,.12,'#273437')}}
const ax=W*.62,ay=H+(reload?12:0);rect(ax-6,ay-47,12,38,'#273c3e');rect(ax-4,ay-52,8,10,'#192c32');rect(ax-10,ay-32,22,34,'#526465');rect(ax-7,ay-31,16,7,'#8b9991');rect(ax+8,ay-19,16,20,'#875f47');if(flash)rect(ax-4,ay-62,8,12,'#ffd26a');
rect(W/2-6,H/2,4,1,'white');rect(W/2+3,H/2,4,1,'white');rect(W/2,H/2-5,1,3,'white');rect(W/2,H/2+3,1,3,'white');
const mx=8,my=H-46;rect(mx,my,40,40,'#203b37');g.strokeStyle='#aacdd3';g.beginPath();g.arc(mx+20,my+20,radius*1.15,0,TAU);g.stroke();for(const b of boxes)if(b.on)rect(mx+2+b.x*1.12,my+2+b.y*1.12,2,2,'#f5bd56');rect(mx+2+p.x*1.12,my+2+p.y*1.12,3,3,'white');
by('hud').textContent='생존 '+(1+bots.filter(b=>b.hp>0).length)+' / 8　 HP '+Math.max(0,Math.ceil(p.hp));by('ammo').textContent=(reload?'장전 중':'탄약')+'　'+clip+' / '+reserve;by('zone').textContent=(Math.hypot(p.x-16,p.y-16)>radius?'⚠ 구역 밖':'안전 구역')+'　'+Math.ceil(radius)+' m';by('notice').textContent=time<until?msg:''}
by('start').onclick=()=>{reset();active=true;by('panel').hidden=true;document.body.classList.add('play');if(matchMedia('(pointer:fine)').matches)canvas.requestPointerLock?.()?.catch(()=>{})};
onkeydown=e=>{if(active){keys.add(e.code);if(['Space','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()}};onkeyup=e=>keys.delete(e.code);onblur=()=>keys.clear();
let drag=null;canvas.onpointerdown=e=>{if(!active)return;canvas.setPointerCapture(e.pointerId);if(e.pointerType==='mouse'){keys.add('Fire');if(!document.pointerLockElement)canvas.requestPointerLock?.()?.catch(()=>{})}else drag=[e.clientX,e.clientY]};
canvas.onpointerup=canvas.onpointercancel=()=>{keys.delete('Fire');drag=null};onmousemove=e=>{if(active&&document.pointerLockElement){angle+=e.movementX*.0025;pitch=Math.max(-.35,Math.min(.35,pitch-e.movementY*.0017))}};canvas.onpointermove=e=>{if(drag){angle+=(e.clientX-drag[0])*.006;pitch=Math.max(-.35,Math.min(.35,pitch-(e.clientY-drag[1])*.003));drag=[e.clientX,e.clientY]}};
for(const b of document.querySelectorAll('[data-k]')){b.onpointerdown=e=>{b.setPointerCapture(e.pointerId);keys.add(b.dataset.k)};b.onpointerup=b.onpointercancel=()=>keys.delete(b.dataset.k)}
reset();let last=performance.now();function frame(now){const dt=Math.min(.06,(now-last)/1000);last=now;if(active)update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
